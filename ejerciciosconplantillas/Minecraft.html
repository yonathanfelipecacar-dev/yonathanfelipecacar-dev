<!DOCTYPE html>
<html>
<head>
<title>W3.CSS Template</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" hojadeestilo/style.css">
</head>

<body>

<!-- Navbar (sit on top) -->
<div class="w3-top">
  <div class="w3-bar w3-white w3-wide w3-padding w3-card">
    <a href="#home" class="w3-bar-item w3-button"><b>3d</b>Minecraft</a>
    <div class="w3-right w3-hide-small">
      <a href="#projects" class="w3-bar-item w3-button">Mobs</a>
      <a href="#about" class="w3-bar-item w3-button">Minecraft 3D</a>
      <a href="#contact" class="w3-bar-item w3-button">Contact</a>
    </div>
  </div>
</div>

<!-- Header -->
<header class="w3-display-container w3-content w3-wide" style="max-width:1500px;" id="home">
  <img class="w3-image" src="imagenes/Screenshot 2026-05-13 09.23.02.png" width="1500" height="800">
  <div class="w3-display-middle w3-margin-top w3-center">
    <h1 class="w3-xxlarge w3-text-white">
      <span class="w3-padding w3-black w3-opacity-min"><b>Mobs</b></span>
      <span class="w3-hide-small w3-text-light-grey">Minecraft</span>
    </h1>
  </div>
</header>

<!-- Page content -->
<div class="w3-content w3-padding" style="max-width:1564px">

  <!-- Project Section -->
  <div class="w3-container w3-padding-32" id="projects">
    <h3 class="w3-border-bottom w3-border-light-grey w3-padding-16">Mobs de Minecraft</h3>
  </div>

  <div class="w3-row-padding">
    <div class="w3-col l3 m6 w3-margin-bottom">
      <div class="w3-display-container">
        <div class="w3-display-topleft w3-black w3-padding">Creeper</div>
        <img src="imagenes/descarga (9).jpeg" style="width:100%">
      </div>
    </div>

    <div class="w3-col l3 m6 w3-margin-bottom">
      <div class="w3-display-container">
        <div class="w3-display-topleft w3-black w3-padding">Zombie</div>
        <img src="imagenes/descarga (10).jpeg" style="width:100%">
      </div>
    </div>

    <div class="w3-col l3 m6 w3-margin-bottom">
      <div class="w3-display-container">
        <div class="w3-display-topleft w3-black w3-padding">Blaze</div>
        <img src="imagenes/descarga (11).jpeg" style="width:100%">
      </div>
    </div>

    <div class="w3-col l3 m6 w3-margin-bottom">
      <div class="w3-display-container">
        <div class="w3-display-topleft w3-black w3-padding">Spider</div>
        <img src="imagenes/images (6).jpeg" style="width:100%">
      </div>
    </div>
  </div>

  <!-- About Section -->
  <div class="w3-container w3-padding-32" id="about">
    <h3 class="w3-border-bottom w3-border-light-grey w3-padding-16">Minecraft 3D</h3>
    <p>
      En el mundo de Minecraft, la creatividad no tiene límites...
      (tu texto completo sigue igual)
    </p>
  </div>

  <!-- Contact Section (ARREGLADA) -->
  <div class="w3-container w3-padding-32" id="contact">
    <h3 class="w3-border-bottom w3-border-light-grey w3-padding-16">Proyecto</h3>
    <p>Lets get in touch and talk about your next project.</p>

    <input class="w3-input w3-border" type="text" placeholder="Name">
    <input class="w3-input w3-section w3-border" type="text" placeholder="Email">
    <input class="w3-input w3-section w3-border" type="text" placeholder="Subject">
    <input class="w3-input w3-section w3-border" type="text" placeholder="Comment">

    <button class="w3-button w3-black w3-section" type="button"
      onclick="window.open('https://www.tinkercad.com/things/baPpJDL25WH-minecraft/edit?returnTo=https%3A%2F%2Fwww.tinkercad.com%2Fdashboard','_blank')">

      <i class="fa fa-paper-plane"></i> Click
    </button>
  </div>

  <!-- Image -->
  <div class="w3-container">
    <img src="imagenes/descarga (14).jpeg" class="w3-image" style="width:100%">
  </div>

</div>

<!-- Footer -->
<footer class="w3-center w3-black w3-padding-16">
  <p>Powered by <a href="https://www.w3schools.com/w3css/default.asp" target="_blank">w3.css</a></p>
</footer>

</body>
</html>
